<!doctype html><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;background:#060E15;overflow:hidden}iframe{border:0;width:100vw;height:100vh;display:block}
#dbg{position:fixed;left:8px;bottom:8px;z-index:9;font:12px monospace;color:#0f0;background:#000;padding:4px 8px}</style>
<iframe id="f" src="/"></iframe><div id="dbg">…</div>
<script>
const y = Number(new URLSearchParams(location.search).get('y') || 0);
const f = document.getElementById('f'), dbg = document.getElementById('dbg');
f.addEventListener('load', () => {
  const go = () => { try { f.contentWindow.document.documentElement.style.scrollBehavior='auto'; f.contentWindow.scrollTo({top:y,behavior:'instant'}); } catch (e) {} };
  setTimeout(go, 400); setTimeout(go, 1500); setTimeout(go, 3000);
  setTimeout(() => { try { f.contentWindow.scrollTo({top:y-40,behavior:'instant'}); f.contentWindow.scrollTo({top:y,behavior:'instant'}); } catch(e){} }, 4000);
  const probe = () => {
    try {
      const d = f.contentDocument;
      dbg.textContent = 'scrollY=' + f.contentWindow.scrollY
        + ' rail=' + (d.querySelector('.rail button.on span')?.textContent || '-')
        + ' in=' + d.querySelectorAll('.chapter.in').length
        + ' callouts=' + d.querySelectorAll('.callout').length
        + ' filmH=' + d.querySelector('.film').offsetHeight
        + ' innerH=' + f.contentWindow.innerHeight
        + ' top=' + Math.round(d.querySelector('.film').getBoundingClientRect().top)
        + ' stageH=' + d.querySelector('.stage').offsetHeight
        + ' mod=' + f.contentWindow.__scrollmod + ' ' + JSON.stringify(f.contentWindow.__readinfo && f.contentWindow.__readinfo());
    } catch (e) { dbg.textContent = 'err ' + e.message; }
  };
  setTimeout(probe, 4200); setTimeout(probe, 5600);
});
</script>
