specVersion: v0.1.0
package:
  name: tick_eth_price
  version: v0.1.0
  description: >-
    Live per-block prices for chosen Uniswap v3 pools, stamped with block time
    and emitted every block, including blocks where nothing traded. Composes
    Pinax's uniswap_v3 package instead of decoding logs itself.

imports:
  uniswap_v3: https://github.com/pinax-network/substreams-evm/releases/download/evm-dex-v0.6.0/uniswap-v3-v0.6.0.spkg

protobuf:
  files:
    - tick/v1/prices.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/tick_eth_price.wasm

modules:
  - name: map_pool_prices
    kind: map
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
      # Never empty, so the module runs on every block (see src/lib.rs).
      - source: sf.ethereum.type.v2.Block
      - map: uniswap_v3:map_events
    output:
      type: proto:tick.v1.BlockPrices

# Pools to watch: 0xpool:decimals0:decimals1[:invert], comma-separated.
# The firmware passes its own list, discovered from the Messari subgraph;
# these defaults are the WETH/stable pools seen trading on Arbitrum.
params:
  map_pool_prices: >-
    0xc6962004f452be9203591991d15f6b388e09e8d0:18:6,
    0x6f38e884725a116c9c7fbf208e79fe8828a2595f:18:6,
    0x641c00a822e8b671738d32a431a4fb6074e5c79d:18:6,
    0xc31e54c7a869b9fcbecc14363cf510d1c41fa443:18:6

network: arbitrum-one
